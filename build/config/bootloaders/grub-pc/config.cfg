set default=0
font=$prefix/unicode.pf2
if loadfont $font ; then
    set gfxmode=800x600
    set gfxpayload=keep
    insmod efi_gop
    insmod efi_uga
    insmod video_bochs
    insmod video_cirrus
    insmod gfxterm
    terminal_output gfxterm
fi
set menu_color_normal=cyan/blue
set menu_color_highlight=white/blue
source ${prefix}/grub.cfg
